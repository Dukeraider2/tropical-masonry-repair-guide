<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Four-step masonry repair sequence</title><desc id="desc">Four schematic panels: inspect and stop if unstable, remove loose material, repair masonry and prepare substrate, then apply compatible render and cure.</desc>
<rect width="1200" height="560" fill="#f7f7f4"/><text x="50" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17212b">REPAIR SEQUENCE / MGA HAKBANG SA PAGKUKUMPUNI</text>
<g font-family="Arial,sans-serif" fill="#17212b">
<rect x="40" y="100" width="265" height="360" rx="16" fill="#fff" stroke="#c4c9cd" stroke-width="2"/><circle cx="78" cy="140" r="22" fill="#b33a2b"/><text x="78" y="148" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><text x="112" y="147" font-size="22" font-weight="700">INSPECT</text>
<rect x="75" y="185" width="195" height="110" fill="#c8cdd1" stroke="#59636c" stroke-width="2"/><path d="M160 190l-15 28 24 13-20 23 17 36" stroke="#b33a2b" stroke-width="5" fill="none"/><text x="172" y="330" text-anchor="middle" font-size="18">Check cracks, lean,</text><text x="172" y="354" text-anchor="middle" font-size="18">bulging and loose blocks.</text><text x="172" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#b33a2b">STOP if unstable</text>
<rect x="325" y="100" width="265" height="360" rx="16" fill="#fff" stroke="#c4c9cd" stroke-width="2"/><circle cx="363" cy="140" r="22" fill="#b36b22"/><text x="363" y="148" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="397" y="147" font-size="22" font-weight="700">REMOVE</text>
<rect x="360" y="185" width="195" height="110" fill="#c8cdd1" stroke="#59636c" stroke-width="2"/><path d="M360 215l30 -15 22 17 26 -22 20 18 20 -12 30 14 47 -10" fill="none" stroke="#b36b22" stroke-width="10"/><text x="457" y="330" text-anchor="middle" font-size="18">Remove loose plaster</text><text x="457" y="354" text-anchor="middle" font-size="18">and weak mortar.</text>
<rect x="610" y="100" width="265" height="360" rx="16" fill="#fff" stroke="#c4c9cd" stroke-width="2"/><circle cx="648" cy="140" r="22" fill="#387a59"/><text x="648" y="148" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="682" y="147" font-size="22" font-weight="700">REPAIR</text>
<rect x="645" y="185" width="195" height="110" fill="#c8cdd1" stroke="#59636c" stroke-width="2"/><path d="M645 222H840 M645 258H840" stroke="#a9845e" stroke-width="8"/><text x="742" y="330" text-anchor="middle" font-size="18">Repoint joints, replace</text><text x="742" y="354" text-anchor="middle" font-size="18">bad blocks, clean surface.</text>
<rect x="895" y="100" width="265" height="360" rx="16" fill="#fff" stroke="#c4c9cd" stroke-width="2"/><circle cx="933" cy="140" r="22" fill="#326c9b"/><text x="933" y="148" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text><text x="967" y="147" font-size="22" font-weight="700">RENDER</text>
<rect x="930" y="185" width="195" height="110" fill="#d6b28b" stroke="#7a5737" stroke-width="2"/><rect x="948" y="185" width="159" height="110" fill="#e6e2d8" stroke="#7b817f" stroke-width="2"/><text x="1027" y="330" text-anchor="middle" font-size="18">Apply approved coats;</text><text x="1027" y="354" text-anchor="middle" font-size="18">protect and cure.</text>
</g><text x="50" y="510" font-family="Arial,sans-serif" font-size="19" fill="#45515d">Follow the product data sheet and local requirements. A render coat does not strengthen an unstable wall.</text>
</svg>