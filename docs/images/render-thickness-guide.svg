<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Render thickness planning guide</title><desc id="desc">Schematic comparison of an even render coat, a deeper hollow requiring staged repair, and a wall condition that needs structural assessment.</desc>
<rect width="1200" height="560" fill="#f7f7f4"/><text x="50" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17212b">RENDER THICKNESS: PLAN, DON'T GUESS</text>
<g font-family="Arial,sans-serif" fill="#17212b">
<rect x="40" y="100" width="350" height="360" rx="16" fill="#fff" stroke="#c4c9cd" stroke-width="2"/><text x="215" y="142" text-anchor="middle" font-size="24" font-weight="700">A. EVEN SURFACE</text><rect x="100" y="180" width="190" height="145" fill="#c8cdd1" stroke="#59636c" stroke-width="2"/><rect x="82" y="180" width="18" height="145" fill="#d6b28b" stroke="#7a5737" stroke-width="2"/><rect x="290" y="180" width="18" height="145" fill="#d6b28b" stroke="#7a5737" stroke-width="2"/><text x="215" y="365" text-anchor="middle" font-size="19">Use the product's</text><text x="215" y="389" text-anchor="middle" font-size="19">approved coat thickness.</text><text x="215" y="425" text-anchor="middle" font-size="18" fill="#387a59">Typical planning: 10–15 mm</text>
<rect x="425" y="100" width="350" height="360" rx="16" fill="#fff" stroke="#c4c9cd" stroke-width="2"/><text x="600" y="142" text-anchor="middle" font-size="24" font-weight="700">B. DEEP LOW SPOT</text><path d="M485 180H715V325H485Z" fill="#c8cdd1" stroke="#59636c" stroke-width="2"/><path d="M467 180H485V325H467Z M715 180H733V325H715Z" fill="#d6b28b" stroke="#7a5737" stroke-width="2"/><path d="M485 240Q600 210 715 240V325H485Z" fill="#d6b28b" stroke="#7a5737" stroke-width="2"/><text x="600" y="365" text-anchor="middle" font-size="19">Repair substrate or use</text><text x="600" y="389" text-anchor="middle" font-size="19">approved staged coats.</text><text x="600" y="425" text-anchor="middle" font-size="18" fill="#b36b22">Don't fill in one thick pass</text>
<rect x="810" y="100" width="350" height="360" rx="16" fill="#fff" stroke="#c4c9cd" stroke-width="2"/><text x="985" y="142" text-anchor="middle" font-size="24" font-weight="700">C. DAMAGED WALL</text><rect x="870" y="180" width="230" height="145" fill="#c8cdd1" stroke="#59636c" stroke-width="2"/><path d="M970 182l-18 33 28 15-20 28 24 18-17 47" fill="none" stroke="#b33a2b" stroke-width="6"/><path d="M870 200l-20 12 20 14 M1100 275l20 10-20 14" fill="none" stroke="#b33a2b" stroke-width="5"/><text x="985" y="365" text-anchor="middle" font-size="19">Bulging, moving, major</text><text x="985" y="389" text-anchor="middle" font-size="19">cracks or loose blocks?</text><text x="985" y="425" text-anchor="middle" font-size="18" fill="#b33a2b">STOP; get it assessed</text>
</g><text x="50" y="510" font-family="Arial,sans-serif" font-size="19" fill="#45515d">All drawings are schematic. Verify actual dimensions, substrate condition, product limits, and local code.</text>
</svg>